510" y="115" width="175" height="66" rx="7" fill="#fff" stroke="#a77b43"/><text x="597.5" y="141" text-anchor="middle" font-size="14" font-weight="600" fill="#70441f">Parallel tasks</text><text x="597.5" y="162" text-anchor="middle" font-size="11" fill="#70441f">Work across the dataset</text><rect x="745" y="115" width="175" height="66" rx="7" fill="#fff" stroke="#a77b43"/><text x="832.5" y="141" text-anchor="middle" font-size="14" font-weight="600" fill="#70441f">Cassandra</text><text x="832.5" y="162" text-anchor="middle" font-size="11" fill="#70441f">Apply row deletions</text><rect x="40" y="295" width="175" height="66" rx="7" fill="#fff" stroke="#a77b43"/><text x="127.5" y="321" text-anchor="middle" font-size="14" font-weight="600" fill="#70441f">Two-week rollout</text><text x="127.5" y="342" text-anchor="middle" font-size="11" fill="#70441f">Run deletion gradually</text><rect x="275" y="295" width="175" height="66" rx="7" fill="#fff" stroke="#a77b43"/><text x="362.5" y="321" text-anchor="middle" font-size="14" font-weight="600" fill="#70441f">Datadog</text><text x="362.5" y="342" text-anchor="middle" font-size="11" fill="#70441f">Watch system stability</text><rect x="510" y="295" width="175" height="66" rx="7" fill="#fff" stroke="#a77b43"/><text x="597.5" y="321" text-anchor="middle" font-size="14" font-weight="600" fill="#70441f">System load</text><text x="597.5" y="342" text-anchor="middle" font-size="11" fill="#70441f">Check Cassandra pressure</text><rect x="745" y="295" width="175" height="66" rx="7" fill="#fff" stroke="#a77b43"/><text x="832.5" y="321" text-anchor="middle" font-size="14" font-weight="600" fill="#70441f">Operational response</text><text x="832.5" y="342" text-anchor="middle" font-size="11" fill="#70441f">Respond to overload</text><rect x="40" y="475" width="175" height="66" rx="7" fill="#fff" stroke="#a77b43"/><text x="127.5" y="501" text-anchor="middle" font-size="14" font-weight="600" fill="#70441f">Overload incident</text><text x="127.5" y="522" text-anchor="middle" font-size="11" fill="#70441f">Cassandra downtime</text><rect x="275" y="475" width="175" height="66" rx="7" fill="#fff" stroke="#a77b43"/><text x="362.5" y="501" text-anchor="middle" font-size="14" font-weight="600" fill="#70441f">Incident response</text><text x="362.5" y="522" text-anchor="middle" font-size="11" fill="#70441f">Handled swiftly</text><rect x="510" y="475" width="175" height="66" rx="7" fill="#fff" stroke="#a77b43"/><text x="597.5" y="501" text-anchor="middle" font-size="14" font-weight="600" fill="#70441f">Data integrity</text><text x="597.5" y="522" text-anchor="middle" font-size="11" fill="#70441f">No data loss</text><rect x="745" y="475" width="175" height="66" rx="7" fill="#fff" stroke="#a77b43"/><text x="832.5" y="501" text-anchor="middle" font-size="14" font-weight="600" fill="#70441f">Cleanup outcome</text><text x="832.5" y="522" text-anchor="middle" font-size="11" fill="#70441f">Trillions of rows removed</text><text x="30" y="612" font-size="11" fill="#70441f">Monitoring informed the rollout. This diagram does not imply an automated throttling system.</text><text x="30" y="632" font-size="11" fill="#70441f">The rollout included one overload-related outage. It was not a zero-downtime migration.</text></g></svg>