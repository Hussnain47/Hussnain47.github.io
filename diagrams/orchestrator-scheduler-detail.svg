<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="title desc"><title id="title">Recurring campaigns across scheduling and execution</title><desc id="desc">Schedule definition: Recurring rule + conditions. Scheduler: Find due schedules. Persistent run state: Track execution progress. Community client: GraphQL action request. Audience selection: Resolve matching users. Redis cache: Reuse audience data. Audience batches: Control database load. Email execution: Process recipients. Leader coordination: Coordinate scheduler work. Run supervisor: Detect stalled runs. Retry handling: Backoff and fail-safes. Execution status: Completion or failure</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#5078ad" stroke-width="1.5"/></marker></defs><g font-family="system-ui,-apple-system,sans-serif"><rect width="960" height="660" rx="14" fill="#e8f0fa"/><text x="30" y="37" font-size="18" font-weight="600" fill="#264b7b">Recurring campaigns across scheduling and execution</text><rect x="20" y="70" width="920" height="150" rx="10" fill="#ffffff" fill-opacity=".42" stroke="#5078ad" stroke-opacity=".22"/><text x="35" y="93" font-size="11" letter-spacing="1" fill="#264b7b">01 / SCHEDULE AND DISPATCH</text><rect x="20" y="250" width="920" height="150" rx="10" fill="#ffffff" fill-opacity=".42" stroke="#5078ad" stroke-opacity=".22"/><text x="35" y="273" font-size="11" letter-spacing="1" fill="#264b7b">02 / RESOLVE AND PROCESS THE AUDIENCE</text><rect x="20" y="430" width="920" height="150" rx="10" fill="#ffffff" fill-opacity=".42" stroke="#5078ad" stroke-opacity=".22"/><text x="35" y="453" font-size="11" letter-spacing="1" fill="#264b7b">03 / COORDINATE AND RECOVER</text><path d="M215 148.0H275" fill="none" stroke="#5078ad" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M450 148.0H510" fill="none" stroke="#5078ad" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M685 148.0H745" fill="none" stroke="#5078ad" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M832.5 181V238.0H832.5V295" fill="none" stroke="#5078ad" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M215 328.0H275" fill="none" stroke="#5078ad" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M450 328.0H510" fill="none" stroke="#5078ad" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M685 328.0H745" fill="none" stroke="#5078ad" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M215 508.0H275" fill="none" stroke="#5078ad" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M450 508.0H510" fill="none" stroke="#5078ad" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M685 508.0H745" fill="none" stroke="#5078ad" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M832.5 361V418.0H832.5V475" fill="none" stroke="#5078ad" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M597.5 181V328.0H362.5V475" fill="none" stroke="#5078ad" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="480.0" y="321.0" text-anchor="middle" font-size="10" fill="#264b7b" stroke="#e8f0fa" stroke-width="4" paint-order="stroke">Observe runs</text><rect x="40" y="115" width="175" height="66" rx="7" fill="#fff" stroke="#5078ad"/><text x="127.5" y="141" text-anchor="middle" font-size="14" font-weight="600" fill="#264b7b">Schedule definition</text><text x="127.5" y="162" text-anchor="middle" font-size="11" fill="#264b7b">Recurring rule + conditions</text><rect x="275" y="115" width="175" height="66" rx="7" fill="#fff" stroke="#5078ad"/><text x="362.5" y="141" text-anchor="middle" font-size="14" font-weight="600" fill="#264b7b">Scheduler</text><text x="362.5" y="162" text-anchor="middle" font-size="11" fill="#264b7b">Find due schedules</text><rect x="510" y="115" width="175" height="66" rx="7" fill="#fff" stroke="#5078ad"/><text x="597.5" y="141" text-anchor="middle" font-size="14" font-weight="600" fill="#264b7b">Persistent run state</text><text x="597.5" y="162" text-anchor="middle" font-size="11" fill="#264b7b">Track execution progress</text><rect x="745" y="115" width="175" height="66" rx="7" fill="#fff" stroke="#5078ad"/><text x="832.5" y="141" text-anchor="middle" font-size="14" font-weight="600" fill="#264b7b">Community client</text><text x="832.5" y="162" text-anchor="middle" font-size="11" fill="#264b7b">GraphQL action request</text><rect x="40" y="295" width="175" height="66" rx="7" fill="#fff" stroke="#5078ad"/><text x="127.5" y="321" text-anchor="middle" font-size="14" font-weight="600" fill="#264b7b">Audience selection</text><text x="127.5" y="342" text-anchor="middle" font-size="11" fill="#264b7b">Resolve matching users</text><rect x="275" y="295" width="175" height="66" rx="7" fill="#fff" stroke="#5078ad"/><text x="362.5" y="321" text-anchor="middle" font-size="14" font-weight="600" fill="#264b7b">Redis cache</text><text x="362.5" y="342" text-anchor="middle" font-size="11" fill="#264b7b">Reuse audience data</text><rect x="510" y="295" width="175" height="66" rx="7" fill="#fff" stroke="#5078ad"/><text x="597.5" y="321" text-anchor="middle" font-size="14" font-weight="600" fill="#264b7b">Audience batches</text><text x="597.5" y="342" text-anchor="middle" font-size="11" fill="#264b7b">Control database load</text><rect x="745" y="295" width="175" height="66" rx="7" fill="#fff" stroke="#5078ad"/><text x="832.5" y="321" text-anchor="middle" font-size="14" font-weight="600" fill="#264b7b">Email execution</text><text x="832.5" y="342" text-anchor="middle" font-size="11" fill="#264b7b">Process recipients</text><rect x="40" y="475" width="175" height="66" rx="7" fill="#fff" stroke="#5078ad"/><text x="127.5" y="501" text-anchor="middle" font-size="14" font-weight="600" fill="#264b7b">Leader coordination</text><text x="127.5" y="522" text-anchor="middle" font-size="11" fill="#264b7b">Coordinate scheduler work</text><rect x="275" y="475" width="175" height="66" rx="7" fill="#fff" stroke="#5078ad"/><text x="362.5" y="501" text-anchor="middle" font-size="14" font-weight="600" fill="#264b7b">Run supervisor</text><text x="362.5" y="522" text-anchor="middle" font-size="11" fill="#264b7b">Detect stalled runs</text><rect x="510" y="475" width="175" height="66" rx="7" fill="#fff" stroke="#5078ad"/><text x="597.5" y="501" text-anchor="middle" font-size="14" font-weight="600" fill="#264b7b">Retry handling</text><text x="597.5" y="522" text-anchor="middle" font-size="11" fill="#264b7b">Backoff and fail-safes</text><rect x="745" y="475" width="175" height="66" rx="7" fill="#fff" stroke="#5078ad"/><text x="832.5" y="501" text-anchor="middle" font-size="14" font-weight="600" fill="#264b7b">Execution status</text><text x="832.5" y="522" text-anchor="middle" font-size="11" fill="#264b7b">Completion or failure</text><text x="30" y="612" font-size="11" fill="#264b7b">Completion and status delivery are checked separately.</text><text x="30" y="632" font-size="11" fill="#264b7b">QA exposed a status-update gap, even when a retrigger observed successful completion.</text></g></svg>