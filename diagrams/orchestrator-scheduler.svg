<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" role="img" aria-labelledby="title desc" class="diagram-file"><style data-motion="true">.diagram-signal{stroke-dasharray:9 91;stroke-dashoffset:100;opacity:0;animation:diagram-travel 1.8s linear 2;animation-play-state:paused}.diagram-node{animation:diagram-highlight 3.6s ease 1;animation-play-state:paused}.diagram-file .diagram-signal,.diagram-file .diagram-node,.is-playing .diagram-signal,.is-playing .diagram-node{animation-play-state:running}.motion-paused .diagram-signal{display:none}.motion-paused .diagram-node{animation:none!important}@keyframes diagram-travel{0%{stroke-dashoffset:100;opacity:0}8%,88%{opacity:.9}100%{stroke-dashoffset:-100;opacity:0}}@keyframes diagram-highlight{0%,100%{fill-opacity:1}25%,65%{fill-opacity:.45}}@media(prefers-reduced-motion:reduce){.diagram-signal{display:none}.diagram-node{animation:none!important}}</style><title id="title">Scheduled campaigns with bounded batches</title><desc id="desc">A clock triggers cached audience processing in three batches; execution returns status and supports retries.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#5078ad" stroke-width="1.5" /></marker></defs><rect width="560" height="340" rx="12" fill="#e8f0fa" /><g font-family="system-ui,-apple-system,sans-serif"><text x="28" y="30" text-anchor="start" font-size="11" fill="#264b7b">RECURRING CAMPAIGN / EXECUTION LIFECYCLE</text><circle cx="87" cy="115" r="40" fill="#f7faff" stroke="#5078ad" stroke-width="2" /><path d="M87 88V115L107 126" fill="none" stroke="#294c7c" stroke-width="3" stroke-linecap="round" /><text x="87" y="178" text-anchor="middle" font-size="13" fill="#264b7b">Due schedule</text><path d="M130 115H185" fill="none" stroke="#5078ad" stroke-width="1.5" marker-end="url(#arrow)" /><path d="M130 115H185" fill="none" stroke="#5078ad" stroke-width="2.5" class="diagram-signal" pathLength="100" aria-hidden="true" /><rect x="190" y="90" width="140" height="50" rx="8" fill="#f7faff" stroke="#86a4cb" class="diagram-node" /><text x="260.0" y="119.0" text-anchor="middle" font-size="13" fill="#264b7b">Audience cache</text><path d="M330 115H375" fill="none" stroke="#5078ad" stroke-width="1.5" marker-end="url(#arrow)" /><path d="M330 115H375" fill="none" stroke="#5078ad" stroke-width="2.5" class="diagram-signal" pathLength="100" aria-hidden="true" /><rect x="385" y="65" width="135" height="32" rx="8" fill="#f7faff" stroke="#86a4cb" class="diagram-node" /><text x="452.5" y="85.0" text-anchor="middle" font-size="13" fill="#264b7b">Batch 1</text><rect x="385" y="110" width="135" height="32" rx="8" fill="#f7faff" stroke="#86a4cb" class="diagram-node" /><text x="452.5" y="130.0" text-anchor="middle" font-size="13" fill="#264b7b">Batch 2</text><rect x="385" y="155" width="135" height="32" rx="8" fill="#f7faff" stroke="#86a4cb" class="diagram-node" /><text x="452.5" y="175.0" text-anchor="middle" font-size="13" fill="#264b7b">Batch 3</text><path d="M450 191V230H300" fill="none" stroke="#5078ad" stroke-width="1.5" marker-end="url(#arrow)" /><path d="M450 191V230H300" fill="none" stroke="#5078ad" stroke-width="2.5" class="diagram-signal" pathLength="100" aria-hidden="true" /><rect x="150" y="210" width="145" height="42" rx="8" fill="#f7faff" stroke="#86a4cb" class="diagram-node" /><text x="222.5" y="235.0" text-anchor="middle" font-size="13" fill="#264b7b">Execute action</text><path d="M150 230H88V165" fill="none" stroke="#5078ad" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 5" /><path d="M150 230H88V165" fill="none" stroke="#5078ad" stroke-width="2.5" stroke-dasharray="4 5" class="diagram-signal" pathLength="100" aria-hidden="true" /><text x="280" y="283" text-anchor="middle" font-size="13" fill="#264b7b">Track status · retry failed work</text><text x="28" y="316" text-anchor="start" font-size="11" fill="#264b7b">Ti