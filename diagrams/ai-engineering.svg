<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" role="img" aria-labelledby="title desc" class="diagram-file"><style data-motion="true">.diagram-signal{stroke-dasharray:9 91;stroke-dashoffset:100;opacity:0;animation:diagram-travel 1.8s linear 2;animation-play-state:paused}.diagram-node{animation:diagram-highlight 3.6s ease 1;animation-play-state:paused}.diagram-file .diagram-signal,.diagram-file .diagram-node,.is-playing .diagram-signal,.is-playing .diagram-node{animation-play-state:running}.motion-paused .diagram-signal{display:none}.motion-paused .diagram-node{animation:none!important}@keyframes diagram-travel{0%{stroke-dashoffset:100;opacity:0}8%,88%{opacity:.9}100%{stroke-dashoffset:-100;opacity:0}}@keyframes diagram-highlight{0%,100%{fill-opacity:1}25%,65%{fill-opacity:.45}}@media(prefers-reduced-motion:reduce){.diagram-signal{display:none}.diagram-node{animation:none!important}}</style><title id="title">AI-first engineering feedback loop</title><desc id="desc">Understanding, implementation, review and testing, and delivery form a loop around AI and human judgment.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#687eae" stroke-width="1.5" /></marker></defs><rect width="560" height="340" rx="12" fill="#e8edf8" /><g font-family="system-ui,-apple-system,sans-serif"><text x="28" y="30" text-anchor="start" font-size="11" fill="#354a78">AI-FIRST / ENGINEERING WITH FEEDBACK</text><rect x="36" y="72" width="142" height="48" rx="8" fill="#f8faff" stroke="#9aadd0" class="diagram-node" /><text x="107.0" y="100.0" text-anchor="middle" font-size="13" fill="#354a78">Understand</text><rect x="373" y="72" width="142" height="48" rx="8" fill="#f8faff" stroke="#9aadd0" class="diagram-node" /><text x="444.0" y="100.0" text-anchor="middle" font-size="13" fill="#354a78">Implement</text><rect x="373" y="229" width="142" height="48" rx="8" fill=