<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="title desc" class="diagram-file"><style data-motion="true">.diagram-signal{stroke-dasharray:9 91;stroke-dashoffset:100;opacity:0;animation:diagram-travel 1.8s linear 2;animation-play-state:paused}.diagram-node{animation:diagram-highlight 3.6s ease 1;animation-play-state:paused}.diagram-file .diagram-signal,.diagram-file .diagram-node,.is-playing .diagram-signal,.is-playing .diagram-node{animation-play-state:running}.motion-paused .diagram-signal{display:none}.motion-paused .diagram-node{animation:none!important}@keyframes diagram-travel{0%{stroke-dashoffset:100;opacity:0}8%,88%{opacity:.9}100%{stroke-dashoffset:-100;opacity:0}}@keyframes diagram-highlight{0%,100%{fill-opacity:1}25%,65%{fill-opacity:.45}}@media(prefers-reduced-motion:reduce){.diagram-signal{display:none}.diagram-node{animation:none!important}}</style><title id="title">Email template management and translation</title><desc id="desc">Admin editor: Concurrent admin updates. GraphQL API: Template operations. Version management: Draft and active versions. Template storage: Version + locale. Manual authoring: Edit each language. AI translation: Generate a translation. Validation: Markup + placeholders. Admin review: Approve each variant. Legacy templates: Translated HBS fallback. Locale resolution: Exact locale, then language. Published version: Approved variants only. Publish version: All languages together</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#8b6cab" stroke-width="1.5" /></marker></defs><g font-family="system-ui,-apple-system,sans-serif"><rect width="960" height="660" rx="14" fill="#f1eafb" /><text x="30" y="37" font-size="18" font-weight="600" fill="#563b7e">Email template management and translation</text><rect x="20" y="70" width="920" height="150" rx="10" fill="#ffffff" fill-opacity=".42" s