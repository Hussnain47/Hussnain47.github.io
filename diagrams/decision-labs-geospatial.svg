<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" role="img" aria-labelledby="title desc" class="diagram-file"><style data-motion="true">.diagram-signal{stroke-dasharray:9 91;stroke-dashoffset:100;opacity:0;animation:diagram-travel 1.8s linear 2;animation-play-state:paused}.diagram-node{animation:diagram-highlight 3.6s ease 1;animation-play-state:paused}.diagram-file .diagram-signal,.diagram-file .diagram-node,.is-playing .diagram-signal,.is-playing .diagram-node{animation-play-state:running}.motion-paused .diagram-signal{display:none}.motion-paused .diagram-node{animation:none!important}@keyframes diagram-travel{0%{stroke-dashoffset:100;opacity:0}8%,88%{opacity:.9}100%{stroke-dashoffset:-100;opacity:0}}@keyframes diagram-highlight{0%,100%{fill-opacity:1}25%,65%{fill-opacity:.45}}@media(prefers-reduced-motion:reduce){.diagram-signal{display:none}.diagram-node{animation:none!important}}</style><title id="title">Geo-temporal data and vehicle visualization</title><desc id="desc">MobilityDB and APIs support a React visualization of vehicle movement over time. The route is illustrative.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#518994" stroke-width="1.5" /></marker></defs><rect width="560" height="340" rx="12" fill="#e2f2f4" /><g font-family="system-ui,-apple-system,sans-serif"><text x="28" y="30" text-anchor="start" font-size="11" fill="#285b65">DECISION LABS / VEHICLES IN SPACE AND TIME</text><rect x="28" y="69" width="145" height="58" rx="8" fill="#f8fdfd" stroke="#8bb8bf" class="diagram-node" /><text x="100.5" y="102.0" text-anchor="middle" font-size="13" fill="#285b65">MobilityDB</text><path d="M174 99H206" fill="none" stroke="#518994" stroke-width="1.5" marker-end="url(#arrow)" /><path d="M174 99H206" fill="none" stroke="#518994" stroke-width="2.5" class="diagram-signal" pathLength="100" aria-hidden="true" /><rect x="214" y="69" width="126" height="58" rx="8" fill="#f8fdfd" stroke="#8bb8bf" class="diagram-node" /><text x="277.0" y="102.0" text-anchor="middle" font-size="13" fill="#285b65">APIs</text><path d="M342 99H372" fill="none" stroke="#518994" stroke-width="1.5" marker-end="url(#arrow)" /><path d="M342 99H372" fill="none" stroke="#518994" stroke-width="2.5" class="diagram-signal" pathLength="100" aria-hidden="true" /><rect x="380" y="69" width="150" height="58" rx="8" fill="#f8fdfd" stroke="#8bb8bf" class="diagram-node" /><text x="455.0" y="102.0" text-anchor="middle" font-size="13" fill="#285b65">React interface</text><rect x="28" y="168" width="502" height="123" rx="10" fill="#f8fdfd" stroke="#8bb8bf" /><path d="M54 261L133 211L208 251L284 200L375 239L486 192" fill="none" stroke="#518994" stroke-width="2" stroke-dasharray="5 4" /><circle cx="284" cy="200" r="8" fill="#326c78" /><text x="50" y="191" text-anchor="start" font-size="10" fill="#285b65">VEHICLE MOVEMENT OVER TIME</text><text x="28" y="319" text-anchor="start" font-size="11" fill="#285b65">Dockerized databases and APIs · animated movement</text></g></svg>