441f">Delete task</text><path d="M305 202H341V147H369" fill="none" stroke="#a77b43" stroke-width="1.5" marker-end="url(#arrow)"/><ellipse cx="445" cy="115" rx="64" ry="19" fill="#fffcf6" stroke="#a77b43"/><path d="M381 115V183C381 208 509 208 509 183V115" fill="#fffcf6" stroke="#a77b43"/><ellipse cx="445" cy="183" rx="64" ry="19" fill="none" stroke="#a77b43"/><text x="445" y="154" text-anchor="middle" font-size="13" fill="#70441f">Cassandra</text><path d="M445 204V246H326" fill="none" stroke="#a77b43" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 5"/><rect x="30" y="239" width="290" height="60" rx="8" fill="#fffcf6" stroke="#c9a97e"/><text x="175.0" y="273.0" text-anchor="middle" font-size="13" fill="#70441f"></text><text x="48" y="260" text-anchor="start" font-size="10" fill="#70441f">DATADOG / SYSTEM STABILITY</text><path d="M48 282H78L88 273L99 282H149L159 263L171 282H207L218 274L232 282H296" fill="none" stroke="#a77b43" stroke-width="2"/><text x="350" y="280" text-anchor="start" font-size="12" fill="#70441f">Observe load</text><text x="28" y="322" text-anchor="start" font-size="11" fill="#70441f">Two-week rollout · trillions of rows · shared system limits</text></g></svg>